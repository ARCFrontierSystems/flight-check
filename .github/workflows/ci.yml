name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and lint (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test-only tools (not used by Seaworthy at runtime)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends poppler-utils
          python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p 'test_*.py' -v
      - name: Lint
        env:
          PRIVATE_DENYLIST: ${{ secrets.SEAWORTHY_LEAK_DENYLIST }}
        run: |
          if [ -n "$PRIVATE_DENYLIST" ]; then
            printf '%s\n' "$PRIVATE_DENYLIST" > "$RUNNER_TEMP/denylist.txt"
            export SEAWORTHY_LEAK_DENYLIST="$RUNNER_TEMP/denylist.txt"
          fi
          python tools/lint_plugin.py

  validate:
    name: Claude Code plugin validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.289
      - name: Validate plugin and marketplace
        run: |
          claude plugin validate --strict plugins/seaworthy
          claude plugin validate --strict .
